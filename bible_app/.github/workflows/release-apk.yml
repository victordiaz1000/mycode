name: Build & release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version (ex. v1.0.1)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable

      - name: Install deps
        run: flutter pub get

      - name: Decode keystore (optionnel)
        # Si tu as un keystore pour signer l'APK, stocke-le en base64
        # dans le secret ANDROID_KEYSTORE_BASE64 et le mot de passe dans
        # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD.
        # Sinon l'APK reste signé en mode debug (installation possible mais
        # mise à jour impossible si déjà installé).
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        # À compléter côté android/app/build.gradle si tu utilises la clé.

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Tag utilisé
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer l'asset
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "bym-${TAG}.apk"
          echo "ASSET=bym-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: BYM ${{ steps.tag.outputs.name }}
          body: |
            Version ${{ steps.tag.outputs.name }} de BYM — Bible de Yehoshoua Ha Mashiah.
            Voir la page de présentation pour les nouveautés.
          files: ${{ env.ASSET }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
