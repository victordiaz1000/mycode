<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <title>Bas-relief assyrien — deux figures gravées dans la pierre</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#D4C2A3"/>
      <stop offset="0.6" stop-color="#B9A484"/>
      <stop offset="1"   stop-color="#A08B6C"/>
    </linearGradient>

    <linearGradient id="figGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#CEBC9A"/>
      <stop offset="1"   stop-color="#A48F6F"/>
    </linearGradient>

    <pattern id="grain" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6"  cy="8"  r="0.8" fill="#7A664A" opacity="0.18"/>
      <circle cx="24" cy="3"  r="0.7" fill="#7A664A" opacity="0.12"/>
      <circle cx="33" cy="17" r="0.9" fill="#7A664A" opacity="0.15"/>
      <circle cx="12" cy="27" r="0.6" fill="#7A664A" opacity="0.13"/>
      <circle cx="28" cy="34" r="0.8" fill="#7A664A" opacity="0.16"/>
      <circle cx="3"  cy="35" r="0.7" fill="#7A664A" opacity="0.11"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="42%" r="74%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2A2013" stop-opacity="0.38"/>
    </radialGradient>

    <filter id="carve" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="-2"   stdDeviation="1.6" flood-color="#33281B" flood-opacity="0.55"/>
      <feDropShadow dx="2"  dy="2.5"  stdDeviation="1.2" flood-color="#F4E7CC" flood-opacity="0.5"/>
    </filter>

    <g id="glyphset">
      <path d="M0 20 L-13 22 L-11 32 Z"/>
      <path d="M16 24 L3 27 L5 37 Z"/>
      <path d="M30 20 L18 23 L20 33 Z"/>
      <path d="M10 4 L-4 7 L-2 17 Z"/>
      <path d="M24 8 L10 11 L12 21 Z"/>
      <path d="M-14 44 L-2 45 L-7 55 Z"/>
    </g>

    <g id="fig">
      <!-- sceptre (derrière) -->
      <rect x="-60" y="-26" width="10" height="352" rx="5"/>
      <path d="M-62 -34 L-48 -34 L-55 -52 Z"/>
      <path d="M-66 326 L-44 326 L-55 342 Z"/>
      <rect x="-60" y="120" width="10" height="6"/>

      <!-- coiffe -->
      <path class="cut" d="M-17 6 C-17 -8 -9 -22 0 -22 C9 -22 17 -8 17 6 Z"/>
      <path class="cut" d="M-1 -22 L1 -22 L0 -34 Z"/>
      <path class="cut" d="M-18 6 L18 6 L17 20 Q0 26 -17 20 Z"/>
      <path class="lin" d="M-15 24 L-15 30 M15 24 L15 30"/>

      <!-- visage + barbe -->
      <path class="cut" d="M-14 20 Q-17 38 -11 50 Q-4 58 0 56 Q4 58 11 50 Q17 38 14 20 Q9 27 6 27 Q-6 27 -14 20 Z"/>
      <path class="cut" d="M-13 38 Q-17 60 -16 90 Q-13 150 0 148 Q13 150 16 90 Q17 60 13 38 Q6 45 0 45 Q-6 45 -13 38 Z"/>
      <path class="lin" d="M-12 62 Q0 70 12 62"/>
      <path class="lin" d="M-13 80 Q0 88 13 80"/>
      <path class="lin" d="M-12 98 Q0 106 12 98"/>
      <path class="lin" d="M-10 116 Q0 123 10 116"/>
      <path class="lin" d="M-7 133 Q0 139 7 133"/>

      <ellipse cx="5" cy="34" rx="3.4" ry="2.2" class="cut"/>
      <circle cx="6" cy="34" r="1" class="cut"/>
      <path class="lin" d="M-2 28 Q5 24 12 29" />
      <path class="lin" d="M5 31 L8 44 L4 44"/>
      <path class="lin" d="M14 40 Q17 44 15 49"/>

      <!-- robe -->
      <path class="cut" d="M-12 56 Q-30 116 -35 190 L-42 310 Q0 342 42 310 L35 190 Q30 116 12 56 Z"/>
      <path class="cut" d="M-35 168 Q0 178 35 168 L36 188 Q0 198 -36 188 Z"/>
      <circle cx="0" cy="184" r="8" class="cut"/>
      <circle cx="0" cy="184" r="4" class="lin"/>
      <circle cx="0" cy="184" r="1" class="cut"/>

      <path class="lin" d="M-34 300 L-33 312 M-24 307 L-23 318 M-14 311 L-13 322 M-4 313 L-3 324 M6 313 L7 324 M16 311 L17 320 M25 307 L26 318"/>

      <!-- bras -->
      <path class="arm" d="M-10 70 Q-40 96 -46 150"/>
      <path class="arm" d="M10 70 Q34 96 40 152"/>
      <circle cx="-46" cy="152" r="7" class="cut"/>
      <circle cx="40" cy="154" r="7" class="cut"/>

      <!-- liseré de lumière (bas-relief) -->
      <path class="rim" d="M-17 20 L17 20"/>
    </g>
  </defs>

  <style>
    .cut { fill: url(#figGrad); stroke: #4B3C2B; stroke-width: 2.5; opacity: .95; }
    .lin { fill: none; stroke: #4B3C2B; stroke-width: 1.6; opacity: .8; }
    .arm { fill: none; stroke: #4B3C2B; stroke-width: 11; stroke-linecap: round; opacity: .55; }
    .rim { fill: none; stroke: #F4E7CC; stroke-width: 2; opacity: .5; }
    .chalk { fill: none; stroke: #EDDFBE; stroke-width: 2; stroke-dasharray: 7 5; opacity: .55; }
  </style>

  <!-- pierre -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>
  <rect width="640" height="480" fill="url(#grain)"/>

  <!-- glyphes cunéiformes + régle -->
  <g filter="url(#carve)" fill="#6E5C44">
    <use href="#glyphset" transform="translate(185,26)"/>
    <use href="#glyphset" transform="translate(455,26) scale(-1,1)"/>
    <use href="#glyphset" transform="translate(332,30) scale(1.3,0.95)"/>
  </g>
  <line x1="118" y1="90" x2="522" y2="90" stroke="#4B3C2B" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="118" y1="96" x2="522" y2="96" stroke="#4B3C2B" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- figures (bas-relief) -->
  <g filter="url(#carve)">
    <use href="#fig" transform="translate(190,120)"/>
    <use href="#fig" transform="translate(455,122) scale(1.02) rotate(1)"/>
  </g>

  <!-- craie décorative : lignes incisées -->
  <g class="chalk">
    <path d="M150 178 Q190 164 232 178"/>
    <path d="M148 182 L148 200"/>
    <path d="M148 214 L148 300"/>

    <path d="M410 178 Q455 164 497 178"/>
    <path d="M410 182 L410 200"/>
    <path d="M410 214 L410 300"/>

    <line x1="118" y1="90"  x2="118" y2="424"/>
    <line x1="320" y1="100" x2="320" y2="424"/>
    <line x1="522" y1="90"  x2="522" y2="424"/>
  </g>

  <!-- vignette + cadre gravé -->
  <rect width="640" height="480" fill="url(#vig)"/>
  <rect x="9"  y="9"  width="622" height="462" fill="none" stroke="#4B3C2B" stroke-width="3" opacity="0.55"/>
  <rect x="17" y="17" width="606" height="446" fill="none" stroke="#4B3C2B" stroke-width="1.5" opacity="0.4"/>
</svg>